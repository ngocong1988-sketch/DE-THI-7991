<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ra Đề Kiểm Tra Chuẩn CV 7991 - Kết Nối Tri Thức</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .doc-preview {
            font-family: "Times New Roman", Times, serif;
            font-size: 13pt;
            line-height: 1.4;
            color: #000;
            background: #fff;
            padding: 20mm 15mm 20mm 25mm;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .doc-preview table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 11.5pt;
        }
        .doc-preview th, .doc-preview td {
            border: 1px solid #000;
            padding: 5px 6px;
            vertical-align: middle;
        }
        .doc-preview th {
            background-color: #f2f2f2;
            font-weight: bold;
            text-align: center;
        }
        .tab-btn.active {
            border-bottom: 3px solid #2563eb;
            color: #1d4ed8;
            font-weight: 600;
            background-color: #eff6ff;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-800 to-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-blue-800 p-2 rounded-lg font-bold text-xl shadow">
                    <i class="fa-solid fa-file-signature"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">TRỢ LÝ KHẢO THÍ CHUẨN CÔNG VĂN 7991</h1>
                    <p class="text-xs text-blue-200">Chương trình GDPT 2018 • Bộ sách Kết nối tri thức với cuộc sống</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2 bg-blue-950/60 px-3 py-2 rounded-lg border border-blue-700">
                <select id="modelSelect" class="bg-blue-900 text-xs text-white border border-blue-600 rounded px-2 py-1 focus:outline-none">
                    <option value="gemini-3.5-flash" selected>Gemini 3.5 Flash (Chuẩn)</option>
                    <option value="gemini-3.5-pro">Gemini 3.5 Pro (Chuyên sâu)</option>
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                </select>
                <i class="fa-solid fa-key text-yellow-400 text-sm"></i>
                <input type="password" id="apiKey" placeholder="Nhập Gemini API Key..." 
                    class="bg-transparent text-sm text-white placeholder-blue-300 focus:outline-none w-44">
                <button onclick="saveApiKey()" class="text-xs bg-blue-600 hover:bg-blue-500 px-2.5 py-1 rounded font-medium transition">Lưu</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Cột trái: Bảng cấu hình ra đề -->
        <div class="lg:col-span-4 space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-base font-bold text-blue-900 border-b pb-2 mb-4 flex items-center">
                    <i class="fa-solid fa-sliders mr-2"></i> THÔNG SỐ & GIỚI HẠN CHƯƠNG TRÌNH
                </h2>

                <div class="space-y-3 text-sm">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">Đơn vị / Trường</label>
                            <input type="text" id="schoolName" value="TRƯỜNG THCS KIÊN LƯƠNG" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">Năm học</label>
                            <input type="text" id="schoolYear" value="2026 - 2027" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">Môn học</label>
                            <select id="subject" onchange="autoFillCurriculum()" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none font-medium">
                                <option value="Tin học" selected>Tin học</option>
                                <option value="Toán">Toán</option>
                                <option value="Khoa học tự nhiên">Khoa học tự nhiên</option>
                                <option value="Ngữ văn">Ngữ văn</option>
                                <option value="Tiếng Anh">Ti
